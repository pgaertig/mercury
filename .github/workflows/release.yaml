name: Release Production JAR

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Version'
        required: true

run-name: "Release Production JAR ${{ github.event.inputs.releaseVersion }}"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: maven
      - name: Configure Git user
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions in behalf of ${{ github.triggering_actor }}"

      - name: Compute next development version
        id: compute_dev
        shell: bash
        run: |
          set -e
          RV="${{ github.event.inputs.releaseVersion }}"
          NEXT_DEV_BASE=$(awk -v v="$RV" 'BEGIN { 
            n = split(v, a, "."); 
            if (n < 2) { 
              print "Invalid release version: " v > "/dev/stderr"; 
              exit 1; 
            }
            maj = a[1] + 0; 
            min = a[2] + 0; 
            printf "%d.%d.0", maj, min + 1; 
          }')
          echo "next_dev_base=${NEXT_DEV_BASE}" >> "$GITHUB_OUTPUT"

      - name: Prepare Maven Release
        run: |
          set -e
          mvn -B  release:prepare --no-transfer-progress \
          -DreleaseVersion=${{ github.event.inputs.releaseVersion }} \
          -DdevelopmentVersion=${{ steps.compute_dev.outputs.next_dev_base }}-SNAPSHOT \
          -DtagNameFormat=v@{project.version}

      - name: Perform Maven Release
        run: mvn -B --no-transfer-progress release:perform

      - name: Push changes
        run: |
         set -e
         git push origin master
         git push origin --tags

      - name: Get Changelog Entry for GitHub Release
        id: changelog
        run: |
          VERSION="v${{ github.event.inputs.releaseVersion }}"
          CHANGELOG_ENTRY=$(awk -v tag="$VERSION" '
          $0 == "## " tag {found=1; next}
          /^## / && found  {exit}
          found           {print}
          ' CHANGELOG.md)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_ENTRY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.releaseVersion }}
          name: Mercury v${{ github.event.inputs.releaseVersion }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            target/checkout/target/mercury-*.jar
          draft: false
          prerelease: false